<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Photochooser — 用键盘快速筛选一堆照片：保留、标记删除、撤销，三键完成。">
    <title>Photochooser · 快速筛照片</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
                    <defs>
                        <linearGradient id="logoGradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#6f9bff"/>
                            <stop offset="1" stop-color="#9a6bff"/>
                        </linearGradient>
                    </defs>
                    <rect x="1" y="1" width="30" height="30" rx="8.5" fill="url(#logoGradient)"/>
                    <rect x="7" y="9" width="15" height="11" rx="2.4" fill="#fff" opacity="0.96"/>
                    <circle cx="18.4" cy="12.4" r="1.6" fill="#f5c451"/>
                    <path d="M9 19l3.6-4.4 3.1 3.5 2-2.2L21 19z" fill="#3f6fdc"/>
                    <circle cx="23.6" cy="22.4" r="5.2" fill="#10b981" stroke="#fff" stroke-width="1.4"/>
                    <path d="M21.2 22.5l1.7 1.7 3-3.2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="brand-name">Photochooser</span>
                <span class="badge" id="modeBadge">Web</span>
            </div>

            <div class="folder-chip" id="folderChip" hidden>
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.2c0-.8.6-1.4 1.4-1.4h3l1.3 1.5h5.9c.8 0 1.4.6 1.4 1.4v6.1c0 .8-.6 1.4-1.4 1.4H2.9c-.8 0-1.4-.6-1.4-1.4z" fill="currentColor"/></svg>
                <span class="folder-name" id="folderName">—</span>
                <span class="folder-kind" id="sourceKind"></span>
            </div>

            <div class="topbar-spacer"></div>

            <div class="stats" id="stats" hidden>
                <span class="stat"><b id="statReviewed">0</b> 已看</span>
                <span class="stat ok"><b id="statKept">0</b> 保留</span>
                <span class="stat bad"><b id="statRejected">0</b> 待删</span>
            </div>

            <button class="btn danger" id="applyBtn" hidden>应用删除</button>
            <button class="btn primary" id="openBtn">打开文件夹</button>
        </header>

        <main class="stage" id="stage">
            <div class="empty" id="empty">
                <div class="empty-card">
                    <div class="empty-icon">
                        <svg viewBox="0 0 48 48" aria-hidden="true">
                            <rect x="5" y="9" width="38" height="30" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
                            <circle cx="33" cy="18" r="3.2" fill="currentColor"/>
                            <path d="M9 34l10-12 7.5 8.5 4.8-5L41 34z" fill="currentColor" opacity="0.55"/>
                        </svg>
                    </div>
                    <h1>把一堆照片，快速筛成几张</h1>
                    <p class="lede">选好文件夹，用键盘就够了：<kbd>1</kbd> 保留并下一张，<kbd>2</kbd> 标记删除，<kbd>3</kbd> 撤销。</p>
                    <button class="btn primary big" id="emptyOpen">选择照片文件夹</button>
                    <p class="hint" id="emptyHint">支持 JPG · PNG · WebP · AVIF · GIF　·　HEIC 请用桌面版</p>
                </div>
            </div>

            <div class="viewer" id="viewer" hidden>
                <canvas id="preview"></canvas>
                <div class="viewer-head">
                    <div class="photo-name" id="photoName"></div>
                    <div class="photo-meta" id="photoMeta"></div>
                </div>
                <div class="rejected-flag" id="rejectedFlag" hidden>已标记删除 · <kbd>3</kbd> 撤销</div>
                <div class="loading" id="loading" hidden><span class="spinner"></span><span>解码中…</span></div>
            </div>
        </main>

        <section class="filmstrip" id="filmstrip" aria-label="照片胶片条" hidden></section>

        <footer class="controls" id="controls" hidden>
            <div class="controls-group">
                <button class="btn icon" id="prevBtn" title="上一张（←）" aria-label="上一张">←</button>
                <button class="btn icon" id="nextBtn" title="下一张（→）" aria-label="下一张">→</button>
            </div>

            <div class="controls-group center">
                <button class="btn keep" id="keepBtn"><kbd>1</kbd>保留</button>
                <button class="btn reject" id="rejectBtn"><kbd>2</kbd>删除</button>
                <button class="btn" id="undoBtn"><kbd>3</kbd>撤销</button>
            </div>

            <div class="controls-group right">
                <span class="progress" id="progress">0 张</span>
                <button class="btn icon" id="helpBtn" title="快捷键" aria-label="快捷键">?</button>
            </div>
        </footer>
    </div>

    <dialog class="help" id="helpDialog">
        <h2>快捷键</h2>
        <dl>
            <div><dt><kbd>1</kbd></dt><dd>保留这张，跳到下一张</dd></div>
            <div><dt><kbd>2</kbd></dt><dd>标记删除，跳到下一张（不会立刻删）</dd></div>
            <div><dt><kbd>3</kbd></dt><dd>撤销上一次标记</dd></div>
            <div><dt><kbd>←</kbd> <kbd>→</kbd></dt><dd>上一张 / 下一张</dd></div>
            <div><dt><kbd>Esc</kbd></dt><dd>关闭这个面板</dd></div>
        </dl>
        <p class="help-note" id="helpNote">标记完成后点右上角「应用删除」一次性处理。</p>
        <form method="dialog"><button class="btn">知道了</button></form>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>

    <script type="text/plain" id="pc-worker-source"></script>
    <script src="core.js"></script>
    <script src="source.js"></script>
    <script src="app.js"></script>
</body>
</html>
